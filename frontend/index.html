<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestione Referti Minibasket</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f6f8;
    }
    h1, h2 { margin-top: 30px; }
    .box {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      max-width: 520px;
      margin-bottom: 30px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 15px;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #004999; }
    .hidden { display: none; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>

<body>

<h1>🏀 Gestione Referti Minibasket</h1>

<!-- LOGIN -->
<div class="box" id="loginBox">
  <h2>🔐 Login</h2>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button id="loginBtn">Login</button>
  <p id="loginMsg"></p>
</div>

<!-- RESET PASSWORD -->
<div class="box">
  <h2>🔁 Password dimenticata</h2>
  <input type="email" id="resetEmail" placeholder="Email">
  <input type="password" id="resetPassword" placeholder="Nuova password">
  <button id="resetBtn">Reimposta password</button>
  <p id="resetMsg"></p>
</div>

<!-- UTENTE -->
<div class="box hidden" id="userBox">
  <h2>👤 Utente loggato</h2>
  <p>Email: <span id="userEmail"></span></p>
  <p>Ruolo: <span id="userRole"></span></p>
  <button onclick="logout()" style="background:#cc0000">🚪 Logout</button>
</div>

<!-- SUPERADMIN -->
<div class="box hidden" id="superAdminBox">
  <h2>🏛️ Crea Comitato Provinciale</h2>
  <input type="text" id="provincia" placeholder="Provincia">
  <input type="email" id="comitatoEmail" placeholder="Email comitato">
  <input type="password" id="comitatoPassword" placeholder="Password">
  <button id="createComitatoBtn">Crea Comitato</button>
  <p id="comitatoMsg"></p>
</div>

<!-- DASHBOARD COMITATO -->
<div class="box hidden" id="comitatoDashboard">
  <h2>🏀 Gestione Partite</h2>

  <h3>➕ Aggiungi Partita</h3>

  <input type="text" id="teamA" placeholder="Squadra A">
  <input type="text" id="teamB" placeholder="Squadra B">
  <input type="date" id="matchDate">
  <input type="time" id="matchTime">
  <input type="text" id="location" placeholder="Campo / Palestra">

  <button onclick="createMatch()">Crea Partita</button>

  <p id="matchMsg"></p>

  <hr>

  <h3>📋 Elenco Partite</h3>
  <div id="matchesList">Caricamento...</div>
</div>


<script>
/* ======================
   CONFIG
====================== */
const API_URL = 'https://caricareferti.onrender.com';
let currentUser = null;

/* ======================
   LOGIN
====================== */
async function login() {
  const email = loginEmail.value.trim();
  const password = loginPassword.value.trim();
  loginMsg.textContent = '';

  if (!email || !password) {
    loginMsg.textContent = 'Inserisci email e password';
    loginMsg.className = 'error';
    return;
  }

  const res = await fetch(API_URL + '/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (!res.ok) {
    loginMsg.textContent = data.message;
    loginMsg.className = 'error';
    return;
  }

  currentUser = data;

  loginBox.classList.add('hidden');
  userBox.classList.remove('hidden');
  userEmail.textContent = data.email;
  userRole.textContent = data.role;

  if (data.role === 'superadmin') {
    superAdminBox.classList.remove('hidden');
  }

  if (data.role === 'comitato') {
    comitatoDashboard.classList.remove('hidden');
    loadMatches();

  }
}

/* ======================
   CREA COMITATO
====================== */
async function createComitato() {
  const res = await fetch(API_URL + '/admin/create-comitato', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      role: currentUser.role
    },
    body: JSON.stringify({
      email: comitatoEmail.value,
      password: comitatoPassword.value,
      province: provincia.value
    })
  });

  const data = await res.json();
  comitatoMsg.textContent = data.message;
  comitatoMsg.className = res.ok ? 'success' : 'error';
}

/* ======================
   RESET PASSWORD
====================== */
async function resetPasswordFn() {
  const res = await fetch(API_URL + '/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: resetEmail.value,
      newPassword: resetPassword.value
    })
  });

  const data = await res.json();
  resetMsg.textContent = data.message;
  resetMsg.className = res.ok ? 'success' : 'error';
}

/* ======================
   LOGOUT
====================== */
function logout() {
  currentUser = null;
  loginBox.classList.remove('hidden');
  userBox.classList.add('hidden');
  superAdminBox.classList.add('hidden');
  comitatoDashboard.classList.add('hidden');
}

/* ======================
   EVENTI
====================== */
loginBtn.addEventListener('click', login);
createComitatoBtn.addEventListener('click', createComitato);
resetBtn.addEventListener('click', resetPasswordFn);

  async function loadMatches() {
  const container = document.getElementById('matchesList');
  container.textContent = 'Caricamento...';

  try {
    const res = await fetch(API_URL + '/matches');
    const data = await res.json();

    if (!data.length) {
      container.innerHTML = '<p>Nessuna partita presente</p>';
      return;
    }

    container.innerHTML = data.map(m => `
      <div style="margin-bottom:10px">
        <strong>${m.team_a} vs ${m.team_b}</strong><br>
        📅 ${m.match_date} ⏰ ${m.match_time}<br>
        📍 ${m.location}
      </div>
    `).join('');

  } catch {
    container.textContent = 'Errore caricamento partite';
  }
}

async function createMatch() {
  const msg = document.getElementById('matchMsg');
  msg.textContent = '';

  const body = {
    team_a: document.getElementById('teamA').value,
    team_b: document.getElementById('teamB').value,
    match_date: document.getElementById('matchDate').value,
    match_time: document.getElementById('matchTime').value,
    location: document.getElementById('location').value
  };

  try {
    const res = await fetch(API_URL + '/matches', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        role: currentUser.role
      },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.message || 'Errore';
      msg.className = 'error';
      return;
    }

    msg.textContent = '✅ Partita creata';
    msg.className = 'success';

    loadMatches();

  } catch {
    msg.textContent = 'Errore di connessione';
    msg.className = 'error';
  }
}

</script>

</body>
</html>
