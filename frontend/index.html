<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestione Referti Minibasket</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f6f8;
    }
    h1, h2, h3 { margin-top: 20px; }
    .box {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      max-width: 520px;
      margin-bottom: 30px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 15px;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #004999; }
    .hidden { display: none; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>

<body>

<h1>🏀 Gestione Referti Minibasket</h1>

<!-- LOGIN -->
<div class="box" id="loginBox">
  <h2>🔐 Login</h2>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button id="loginBtn">Login</button>
  <p id="loginMsg"></p>
</div>

<!-- RESET PASSWORD -->
<div class="box">
  <h2>🔁 Password dimenticata</h2>
  <input type="email" id="resetEmail" placeholder="Email">
  <input type="password" id="resetPassword" placeholder="Nuova password">
  <button id="resetBtn">Reimposta password</button>
  <p id="resetMsg"></p>
</div>

<!-- UTENTE -->
<div class="box hidden" id="userBox">
  <h2>👤 Utente loggato</h2>
  <p>Email: <strong><span id="userEmail"></span></strong></p>
  <p>Ruolo: <strong><span id="userRole"></span></strong></p>
  <button onclick="logout()" style="background:#cc0000">🚪 Logout</button>
</div>

<!-- SUPERADMIN -->
<div class="box hidden" id="superAdminBox">
  <h2>🏛️ Crea Comitato Provinciale</h2>
  <input type="text" id="provincia" placeholder="Provincia">
  <input type="email" id="comitatoEmail" placeholder="Email comitato">
  <input type="password" id="comitatoPassword" placeholder="Password iniziale">
  <button id="createComitatoBtn">Crea Comitato</button>
  <p id="comitatoMsg"></p>
</div>

<!-- DASHBOARD COMITATO -->
<div class="box hidden" id="comitatoDashboard">
  <h2>🏀 Dashboard Comitato</h2>

  <label>Stagione sportiva</label>
  <select id="seasonSelect"></select>

  <label>Categoria</label>
  <select id="categorySelect"></select>

  <label>Fase</label>
  <select id="phaseSelect"></select>

  <label>Girone</label>
  <select id="groupSelect"></select>

  <hr>

  <h3>📥 Importa partite da Excel</h3>
  <input type="file" id="excelFile" accept=".xlsx">
  <button id="importBtn">Importa partite</button>
  <p id="importMsg"></p>
</div>

<script>
/* ======================
   CONFIG
====================== */
const API_URL = 'https://caricareferti.onrender.com';
let currentUser = null;

/* ======================
   LOGIN
====================== */
async function login() {
  loginMsg.textContent = '';

  const res = await fetch(API_URL + '/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: loginEmail.value,
      password: loginPassword.value
    })
  });

  const data = await res.json();

  if (!res.ok) {
    loginMsg.textContent = data.message;
    loginMsg.className = 'error';
    return;
  }

  currentUser = data;

  loginBox.classList.add('hidden');
  userBox.classList.remove('hidden');

  userEmail.textContent = data.email;
  userRole.textContent = data.role;

  if (data.role === 'superadmin') {
    superAdminBox.classList.remove('hidden');
  }

  if (data.role === 'comitato') {
    comitatoDashboard.classList.remove('hidden');
    loadSeasons();
  }
}

/* ======================
   LOGOUT
====================== */
function logout() {
  currentUser = null;
  loginBox.classList.remove('hidden');
  userBox.classList.add('hidden');
  superAdminBox.classList.add('hidden');
  comitatoDashboard.classList.add('hidden');
}

/* ======================
   RESET PASSWORD
====================== */
async function resetPasswordFn() {
  const res = await fetch(API_URL + '/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: resetEmail.value,
      newPassword: resetPassword.value
    })
  });

  const data = await res.json();
  resetMsg.textContent = data.message;
  resetMsg.className = res.ok ? 'success' : 'error';
}

/* ======================
   CREA COMITATO
====================== */
async function createComitato() {
  const res = await fetch(API_URL + '/admin/create-comitato', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      role: currentUser.role
    },
    body: JSON.stringify({
      email: comitatoEmail.value,
      password: comitatoPassword.value,
      province: provincia.value
    })
  });

  const data = await res.json();
  comitatoMsg.textContent = data.message;
  comitatoMsg.className = res.ok ? 'success' : 'error';
}

/* ======================
   SELECT A CASCATA
====================== */
async function loadSeasons() {
  const res = await fetch(API_URL + '/seasons');
  const data = await res.json();
  seasonSelect.innerHTML = '<option value="">Seleziona</option>';
  data.forEach(s => seasonSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`);
}

seasonSelect.addEventListener('change', async () => {
  categorySelect.innerHTML = '';
  phaseSelect.innerHTML = '';
  groupSelect.innerHTML = '';
  const res = await fetch(`${API_URL}/categories?seasonId=${seasonSelect.value}`);
  const data = await res.json();
  categorySelect.innerHTML = '<option value="">Seleziona</option>';
  data.forEach(c => categorySelect.innerHTML += `<option value="${c.id}">${c.name}</option>`);
});

categorySelect.addEventListener('change', async () => {
  phaseSelect.innerHTML = '';
  groupSelect.innerHTML = '';
  const res = await fetch(`${API_URL}/phases?categoryId=${categorySelect.value}`);
  const data = await res.json();
  phaseSelect.innerHTML = '<option value="">Seleziona</option>';
  data.forEach(p => phaseSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`);
});

phaseSelect.addEventListener('change', async () => {
  const res = await fetch(`${API_URL}/groups?phaseId=${phaseSelect.value}`);
  const data = await res.json();
  groupSelect.innerHTML = '<option value="">Seleziona</option>';
  data.forEach(g => groupSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`);
});

/* ======================
   IMPORT EXCEL
====================== */
async function importMatches() {
  importMsg.textContent = '';

  if (!groupSelect.value || !excelFile.files.length) {
    importMsg.textContent = 'Seleziona girone e file Excel';
    importMsg.className = 'error';
    return;
  }

  const fd = new FormData();
  fd.append('file', excelFile.files[0]);

  const res = await fetch(`${API_URL}/matches/import/${groupSelect.value}`, {
    method: 'POST',
    body: fd
  });

  const data = await res.json();
  importMsg.textContent = data.message || 'Import completato';
  importMsg.className = res.ok ? 'success' : 'error';
}

/* ======================
   EVENTI
====================== */
loginBtn.onclick = login;
resetBtn.onclick = resetPasswordFn;
createComitatoBtn.onclick = createComitato;
importBtn.onclick = importMatches;
</script>

</body>
</html>
