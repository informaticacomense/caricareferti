
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestione Referti Minibasket</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f6f8;
    }
    h1, h2, h3 {
      margin-top: 20px;
    }
    .box {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      max-width: 900px;
      margin-bottom: 30px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    button {
      background: #0066cc;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background: #004999;
    }
    .danger {
      background: #cc0000;
    }
    .hidden {
      display: none;
    }
    .success {
      color: green;
    }
    .error {
      color: red;
    }
    hr {
      margin: 30px 0;
    }
  </style>
</head>

<body>

<h1>Gestione Referti Minibasket</h1>

<!-- ================= LOGIN ================= -->
<div class="box" id="loginBox">
  <h2>Login</h2>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button id="loginBtn">Login</button>
  <p id="loginMsg"></p>
</div>

<!-- ================= RESET PASSWORD ================= -->
<div class="box">
  <h2>Password dimenticata</h2>
  <input type="email" id="resetEmail" placeholder="Email">
  <input type="password" id="resetNewPassword" placeholder="Nuova password">
  <button id="resetBtn">Reimposta password</button>
  <p id="resetMsg"></p>
</div>

<!-- ================= UTENTE ================= -->
<div class="box hidden" id="userBox">
  <h2>Utente loggato</h2>
  <p>Email: <strong id="userEmail"></strong></p>
  <p>Ruolo: <strong id="userRole"></strong></p>
  <p>Provincia: <strong id="userProvince"></strong></p>
  <button id="logoutBtn" class="danger">Logout</button>
</div>

<!-- ================= SUPERADMIN ================= -->
<div class="box hidden" id="superAdminBox">
  <h2>Crea Comitato Provinciale</h2>

  <input id="provinceInput" placeholder="Provincia (es. Milano)">
  <input id="committeeEmail" placeholder="Email comitato">
  <input id="committeePassword" placeholder="Password iniziale">

  <button id="createCommitteeBtn">Crea comitato</button>
  <p id="committeeMsg"></p>
</div>

<!-- ================= DASHBOARD COMITATO ================= -->
<div class="box hidden" id="committeeDashboard">

  <h2>Dashboard Comitato</h2>

  <!-- STAGIONI -->
  <h3>Crea stagione</h3>
  <input id="newSeasonName" placeholder="Es. 2025/2026">
  <button id="createSeasonBtn">Crea stagione</button>
  <p id="seasonMsg"></p>

  <hr>

  <!-- CATEGORIE -->
  <h3>Crea categoria</h3>
  <select id="seasonSelect"></select>
  <input id="newCategoryName" placeholder="Es. Aquilotti">
  <button id="createCategoryBtn">Crea categoria</button>
  <p id="categoryMsg"></p>

  <hr>

  <!-- FASI -->
  <h3>Crea fase</h3>
  <select id="categorySelect"></select>
  <input id="newPhaseName" placeholder="Es. Prima fase">
  <button id="createPhaseBtn">Crea fase</button>
  <p id="phaseMsg"></p>

  <hr>

  <!-- GIRONI -->
  <h3>Crea girone</h3>
  <select id="phaseSelect"></select>
  <input id="newGroupName" placeholder="Es. Girone A">
  <button id="createGroupBtn">Crea girone</button>
  <p id="groupMsg"></p>

  <hr>

  <!-- IMPORT PARTITE -->
  <h3>Importa partite da Excel</h3>
  <select id="groupSelect"></select>
  <input type="file" id="excelFile" accept=".xlsx">
  <button id="importMatchesBtn">Importa partite</button>
  <p id="importMsg"></p>

</div>

<script>
const API_URL = 'https://caricareferti.onrender.com';
let currentUser = null;

/* ================= LOGIN ================= */
async function login() {
  loginMsg.textContent = '';
  try {
    const res = await fetch(API_URL + '/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: loginEmail.value.trim(),
        password: loginPassword.value.trim()
      })
    });

    const data = await res.json();
    if (!res.ok) {
      loginMsg.textContent = data.message;
      loginMsg.className = 'error';
      return;
    }

    currentUser = data;

    loginBox.classList.add('hidden');
    userBox.classList.remove('hidden');
    userEmail.textContent = data.email;
    userRole.textContent = data.role;
    userProvince.textContent = data.province || '-';

    if (data.role === 'superadmin') {
      superAdminBox.classList.remove('hidden');
    }

    if (data.role === 'comitato') {
      committeeDashboard.classList.remove('hidden');
      loadSeasons();
    }

  } catch {
    loginMsg.textContent = 'Errore di connessione';
    loginMsg.className = 'error';
  }
}

/* ================= LOGOUT ================= */
function logout() {
  currentUser = null;
  loginBox.classList.remove('hidden');
  userBox.classList.add('hidden');
  superAdminBox.classList.add('hidden');
  committeeDashboard.classList.add('hidden');
}

/* ================= RESET PASSWORD ================= */
async function resetPassword() {
  const res = await fetch(API_URL + '/reset-password', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      email: resetEmail.value.trim(),
      newPassword: resetNewPassword.value.trim()
    })
  });

  const data = await res.json();
  resetMsg.textContent = data.message;
  resetMsg.className = res.ok ? 'success' : 'error';
}

/* ================= SUPERADMIN ================= */
async function createCommittee() {
  committeeMsg.textContent = '';

  const res = await fetch(API_URL + '/admin/create-comitato', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      role: currentUser.role
    },
    body: JSON.stringify({
      province: provinceInput.value.trim(),
      email: committeeEmail.value.trim(),
      password: committeePassword.value.trim()
    })
  });

  const data = await res.json();
  committeeMsg.textContent = data.message;
  committeeMsg.className = res.ok ? 'success' : 'error';
}

/* ================= STAGIONI ================= */
async function loadSeasons() {
  const res = await fetch(API_URL + '/seasons');
  const data = await res.json();

  seasonSelect.innerHTML = '<option value="">Seleziona stagione</option>';
  data.forEach(s => {
    seasonSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
  });
}

async function createSeason() {
  const res = await fetch(API_URL + '/seasons', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      role: currentUser.role
    },
    body: JSON.stringify({ name: newSeasonName.value.trim() })
  });

  const data = await res.json();
  seasonMsg.textContent = data.message;
  seasonMsg.className = res.ok ? 'success' : 'error';
  loadSeasons();
}

/* ================= CATEGORIE ================= */
seasonSelect.onchange = async () => {
  const res = await fetch(API_URL + '/categories?seasonId=' + seasonSelect.value);
  const data = await res.json();

  categorySelect.innerHTML = '<option value="">Seleziona categoria</option>';
  data.forEach(c => {
    categorySelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });
};

async function createCategory() {
  const res = await fetch(API_URL + '/categories', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      role: currentUser.role
    },
    body: JSON.stringify({
      season_id: seasonSelect.value,
      name: newCategoryName.value.trim()
    })
  });

  const data = await res.json();
  categoryMsg.textContent = data.message || 'Categoria creata';
  categoryMsg.className = res.ok ? 'success' : 'error';
}

/* ================= FASI ================= */
categorySelect.onchange = async () => {
  const res = await fetch(API_URL + '/phases?categoryId=' + categorySelect.value);
  const data = await res.json();

  phaseSelect.innerHTML = '<option value="">Seleziona fase</option>';
  data.forEach(p => {
    phaseSelect.innerHTML += `<option value="${p.id}">${p.name}</option>`;
  });
};

async function createPhase() {
  const res = await fetch(API_URL + '/phases', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      role: currentUser.role
    },
    body: JSON.stringify({
      category_id: categorySelect.value,
      name: newPhaseName.value.trim()
    })
  });

  const data = await res.json();
  phaseMsg.textContent = data.message || 'Fase creata';
  phaseMsg.className = res.ok ? 'success' : 'error';
}

/* ================= GIRONI ================= */
phaseSelect.onchange = async () => {
  const res = await fetch(API_URL + '/groups?phaseId=' + phaseSelect.value);
  const data = await res.json();

  groupSelect.innerHTML = '<option value="">Seleziona girone</option>';
  data.forEach(g => {
    groupSelect.innerHTML += `<option value="${g.id}">${g.name}</option>`;
  });
};

async function createGroup() {
  const res = await fetch(API_URL + '/groups', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      role: currentUser.role
    },
    body: JSON.stringify({
      phase_id: phaseSelect.value,
      name: newGroupName.value.trim()
    })
  });

  const data = await res.json();
  groupMsg.textContent = data.message || 'Girone creato';
  groupMsg.className = res.ok ? 'success' : 'error';
}

/* ================= IMPORT MATCHES ================= */
async function importMatches() {
  const form = new FormData();
  form.append('file', excelFile.files[0]);

  const res = await fetch(
    API_URL + '/matches/import/' + groupSelect.value,
    {
      method: 'POST',
      headers: { role: currentUser.role },
      body: form
    }
  );

  const data = await res.json();
  importMsg.textContent = data.message;
  importMsg.className = res.ok ? 'success' : 'error';
}

/* ================= EVENTS ================= */
loginBtn.onclick = login;
logoutBtn.onclick = logout;
resetBtn.onclick = resetPassword;
createCommitteeBtn.onclick = createCommittee;
createSeasonBtn.onclick = createSeason;
createCategoryBtn.onclick = createCategory;
createPhaseBtn.onclick = createPhase;
createGroupBtn.onclick = createGroup;
importMatchesBtn.onclick = importMatches;
</script>

</body>
</html>
