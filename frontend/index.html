<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Caricare Referti Minibasket</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f6f8;
    }

    h1, h2 {
      margin-top: 30px;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      max-width: 500px;
      margin-bottom: 30px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      margin-bottom: 15px;
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #004999;
    }

    .hidden {
      display: none;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

<h1>🏀 Gestione Referti Minibasket</h1>

<!-- LOGIN -->
<div class="box" id="loginBox">
  <h2>🔐 Login</h2>

  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()">Login</button>

  <p id="loginMsg"></p>
</div>

<!-- INFO UTENTE -->
<div class="box hidden" id="userBox">
  <h2>👤 Utente loggato</h2>
  <p><strong>Email:</strong> <span id="userEmail"></span></p>
  <p><strong>Ruolo:</strong> <span id="userRole"></span></p>
</div>

<!-- SUPER ADMIN: CREA COMITATO -->
<div class="box hidden" id="superAdminBox">
  <h2>🏛️ Crea Comitato Provinciale</h2>

  <input type="text" id="provincia" placeholder="Provincia (es. Milano)">
  <input type="email" id="comitatoEmail" placeholder="Email comitato">
  <input type="password" id="comitatoPassword" placeholder="Password iniziale">

  <button onclick="createComitato()">Crea Comitato</button>

  <p id="comitatoMsg"></p>
</div>

<script>
const API_URL = 'https://caricareferti.onrender.com';
let currentUser = null;

/* ======================
   LOGIN
====================== */
async function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');

  msg.textContent = '';

  try {
    const res = await fetch(API_URL + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.message;
      msg.className = 'error';
      return;
    }

    currentUser = data;

    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('userBox').classList.remove('hidden');

    document.getElementById('userEmail').textContent = data.email;
    document.getElementById('userRole').textContent = data.role;

    if (data.role === 'superadmin') {
      document.getElementById('superAdminBox').classList.remove('hidden');
    }

  } catch (e) {
    msg.textContent = 'Errore di connessione';
    msg.className = 'error';
  }
}

/* ======================
   CREA COMITATO
====================== */
async function createComitato() {
  const provincia = document.getElementById('provincia').value;
  const email = document.getElementById('comitatoEmail').value;
  const password = document.getElementById('comitatoPassword').value;
  const msg = document.getElementById('comitatoMsg');

  msg.textContent = '';

  if (!provincia || !email || !password) {
    msg.textContent = 'Tutti i campi sono obbligatori';
    msg.className = 'error';
    return;
  }

  try {
    const res = await fetch(API_URL + '/admin/create-comitato', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        role: currentUser.role
      },
      body: JSON.stringify({
        email,
        password,
        province: provincia
      })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.message || 'Errore';
      msg.className = 'error';
      return;
    }

    msg.textContent = '✅ Comitato creato con successo';
    msg.className = 'success';

  } catch (e) {
    msg.textContent = 'Errore di connessione';
    msg.className = 'error';
  }
}
</script>

</body>
</html>
