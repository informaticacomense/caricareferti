<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestione Referti Minibasket</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f6f8;
    }

    h1, h2 {
      margin-top: 30px;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      max-width: 520px;
      margin-bottom: 30px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #004999;
    }

    .hidden {
      display: none;
    }

    .success {
      color: green;
      margin-top: 10px;
    }

    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>🏀 Gestione Referti Minibasket</h1>

<!-- LOGIN -->
<div class="box" id="loginBox">
  <h2>🔐 Login</h2>

  <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
  <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">

  <button id="loginBtn">Login</button>

  <p id="loginMsg"></p>
</div>

<div class="box">
  <h2>🔁 Password dimenticata</h2>

  <input type="email" id="resetEmail" placeholder="Email">
  <input type="password" id="resetPassword" placeholder="Nuova password">

  <button onclick="resetPassword()">Reimposta password</button>

  <p id="resetMsg"></p>
</div>

  
<!-- INFO UTENTE -->
<div class="box hidden" id="userBox">
  <h2>👤 Utente loggato</h2>
  <p><strong>Email:</strong> <span id="userEmail"></span></p>
  <p><strong>Ruolo:</strong> <span id="userRole"></span></p>
</div>

<!-- SUPER ADMIN -->
<div class="box hidden" id="superAdminBox">
  <h2>🏛️ Crea Comitato Provinciale</h2>

  <input type="text" id="provincia" placeholder="Provincia (es. Milano)">
  <input type="email" id="comitatoEmail" placeholder="Email comitato">
  <input type="password" id="comitatoPassword" placeholder="Password iniziale">

  <button id="createComitatoBtn">Crea Comitato</button>

  <p id="comitatoMsg"></p>
</div>

<script>
const API_URL = 'https://caricareferti.onrender.com';
let currentUser = null;

/* ======================
   LOGIN
====================== */
async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const msg = document.getElementById('loginMsg');

  msg.textContent = '';
  msg.className = '';

  if (!email || !password) {
    msg.textContent = 'Inserisci email e password';
    msg.className = 'error';
    return;
  }

  try {
    const res = await fetch(`${API_URL}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.message || 'Login fallito';
      msg.className = 'error';
      return;
    }

    currentUser = data;

    // mostra info utente
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('userBox').classList.remove('hidden');

    document.getElementById('userEmail').textContent = data.email;
    document.getElementById('userRole').textContent = data.role;

    // solo superadmin
    if (data.role === 'superadmin') {
      document.getElementById('superAdminBox').classList.remove('hidden');
    }

    if (data.role === 'comitato') {
  document.getElementById('comitatoDashboard').classList.remove('hidden');
}


  } catch (err) {
    msg.textContent = 'Errore di connessione al server';
    msg.className = 'error';
  }
}

/* ======================
   CREA COMITATO
====================== */
async function createComitato() {
  const provincia = document.getElementById('provincia').value.trim();
  const email = document.getElementById('comitatoEmail').value.trim();
  const password = document.getElementById('comitatoPassword').value.trim();
  const msg = document.getElementById('comitatoMsg');

  msg.textContent = '';
  msg.className = '';

  if (!provincia || !email || !password) {
    msg.textContent = 'Tutti i campi sono obbligatori';
    msg.className = 'error';
    return;
  }

  try {
    const res = await fetch(`${API_URL}/admin/create-comitato`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'role': currentUser.role
      },
      body: JSON.stringify({
        email,
        password,
        province: provincia
      })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.message || 'Errore';
      msg.className = 'error';
      return;
    }

    msg.textContent = '✅ Comitato creato con successo';
    msg.className = 'success';

    document.getElementById('provincia').value = '';
    document.getElementById('comitatoEmail').value = '';
    document.getElementById('comitatoPassword').value = '';

  } catch (err) {
    msg.textContent = 'Errore di connessione al server';
    msg.className = 'error';
  }
}

<div class="box hidden" id="comitatoDashboard">
  <h2>🏀 Dashboard Comitato Provinciale</h2>

  <p>Da qui potrai:</p>
  <ul>
    <li>📅 Gestire campionati e categorie</li>
    <li>📥 Importare calendari Excel</li>
    <li>📄 Caricare referti PDF</li>
  </ul>

  <button onclick="alert('Prossimo step')">
    Inizia
  </button>
</div>

  
/* ======================
   EVENTI
====================== */
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('createComitatoBtn').addEventListener('click', createComitato);
</script>

<script>
async function resetPassword() {
  const email = document.getElementById('resetEmail').value;
  const newPassword = document.getElementById('resetPassword').value;
  const msg = document.getElementById('resetMsg');

  msg.textContent = '';

  if (!email || !newPassword) {
    msg.textContent = 'Email e password obbligatorie';
    msg.className = 'error';
    return;
  }

  try {
    const res = await fetch(API_URL + '/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, newPassword })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.message || 'Errore';
      msg.className = 'error';
      return;
    }

    msg.textContent = '✅ Password aggiornata, ora puoi fare login';
    msg.className = 'success';

  } catch (e) {
    msg.textContent = 'Errore di connessione';
    msg.className = 'error';
  }
}
</script>

  
</body>
</html>
